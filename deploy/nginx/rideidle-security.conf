# The headers every answer of the site carries. provision.sh puts this file in /etc/nginx/snippets/.
#
# nginx does not pass the headers of the server on to a location that sets a header of its own, so the locations that
# set Cache-Control include this file again.
#
# There is no Content-Security-Policy yet, on purpose: the messages of the app are compiled in the browser (vue-i18n),
# which needs 'unsafe-eval' until they are compiled at build time, and a policy with it protects little.

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# The address of a page can hold the secret of a link (/account/confirm?token=...), so it is never sent on to another site.
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
