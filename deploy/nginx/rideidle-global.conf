# Settings of the whole http context of nginx. provision.sh puts this file in /etc/nginx/conf.d/.

# The log of requests without the query string. The link in an e-mail is /account/confirm?token=SECRET, and the code that
# Google or Facebook sends back is in the address as well: the default format would keep them in the log for two weeks.
# $rideidle_path is the address that was asked for, up to the ?. ($uri would show /index.html for every page of the app.)
map $request_uri $rideidle_path {
    default "-";
    ~^(?<path>[^?]*) $path;
}
log_format rideidle '$remote_addr [$time_local] "$request_method $rideidle_path $server_protocol" $status $body_bytes_sent "$http_user_agent"';

# The page that an address of the app is answered with. A person gets the app (/index.html). A robot that makes the preview of a link (a chat, a social network) or
# reads a page for a search engine does not run the app, so it cannot read what the game calls itself: it is sent to an internal address of the site, which asks the
# API for the same page with the tags of the game in its head (GET /api/v1/meta/share, the game is the one of the host). Only a GET or a HEAD of a robot from the
# list is sent there; the list is the name that each of them gives itself, in any case. A person whose browser is taken for a robot still gets a working app, since
# the page of the API is the page of the app. See rideidle.conf.template.
map "$request_method:$http_user_agent" $rideidle_app_page {
    default /index.html;
    "~*^(?:GET|HEAD):.*(?:facebookexternalhit|facebot|twitterbot|slackbot|slack-imgproxy|linkedinbot|whatsapp|telegrambot|discordbot|pinterest.com/bot|pinterestbot|skypeuripreview|vkshare|redditbot|embedly|iframely|mastodon|viber|applebot|googlebot|bingbot|duckduckbot)" /__rideidle_preview;
}

# A limit for the API: twenty requests a second for one address, and a burst of forty over it. An open garage asks every
# fifteen seconds, so this is far above what a player does and far below what a flood does. See limit_req in the site.
# (Only definitions with names of their own are here, so that this file can sit next to the configuration of other sites.
# The settings that would change them, server_tokens and limit_req_status, are in the server blocks of the site.)
limit_req_zone $binary_remote_addr zone=rideidle_api:10m rate=20r/s;
